<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="icon" href="./favicon.png" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Kho văn bản nội bộ - BV YHCT Quảng Nam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
    
</head>
<body>
<div class="container">
    <div id="loginOverlay" class="login-overlay">
        <div class="login-box">
            <h2><i class="fas fa-folder-open"></i> Kho văn bản nội bộ</h2>
            <div class="hospital-name">Bệnh viện Y học cổ truyền Quảng Nam</div>
            <div class="login-logo">
            	<img src="./favicon.png" alt="Logo Bệnh viện" style="width: 100px; height: auto; margin-bottom: 5px;">
            </div>
            <input type="text" id="username" class="login-input" placeholder="Tên đăng nhập" autocomplete="off">
            <input type="password" id="password" class="login-input" placeholder="Mật khẩu">
            <button id="loginBtn" class="login-btn">Đăng nhập</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>
    <div id="mainContent" class="main-content">
        <div class="header">
            <h1><div class="login-logo">
			<img src="./favicon.png" alt="Logo Bệnh viện" style="width: 34px; height: auto; margin-left:0px; margin-top:0px;margin-bottom:-5px;">
            	</div> Kho văn bản nội bộ</h1>
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="badge-count"><i class="fas fa-yin-yang"></i> Bệnh viện Y học cổ truyền Quảng Nam</div>
                <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </div>
        <div class="main-layout">
            <div class="vertical-tabs" id="tabContainer"></div>
            <div class="content-area">
                <div class="search-bar">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm theo tên văn bản, số ký hiệu...">
                    <button id="searchClearBtn" class="search-clear"><i class="fas fa-times-circle"></i></button>
                </div>
                <div class="table-wrapper">
                    <table class="proc-table">
                        <thead><tr><th>Tên văn bản</th><th>Số, ký hiệu</th><th>Ban hành</th><th>File</th></tr></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div id="paginationContainer" class="pagination"></div>
            </div>
        </div>
        <div class="footer-note">
            <div><i class="far fa-copyright"></i> <span id="currentYear"></span> Bệnh viện Y học cổ truyền Quảng Nam</div>
            <div><i class="fas fa-database"></i> Hệ thống quản lý văn bản - Phòng Kế hoạch tổng hợp - Điều dưỡng</div>
        </div>
    </div>
</div>

</body>
</html>
